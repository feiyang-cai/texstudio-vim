name: Packaged desktop retest
on:
  push:
    paths:
      - .github/scripts/smoke-native-package.py
      - .github/scripts/package_identity.py
      - .github/scripts/smoke-appimage.py
      - .github/scripts/windows_desktop_input.py
      - .github/scripts/windows_gui_guard.py
      - .github/scripts/prepare-windows-gui.ps1
      - .github/scripts/select-gui-build.py
      - .github/workflows/packaged-gui.yml
  workflow_call:
    inputs:
      build_run_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Existing CD run ID (empty selects latest compatible packages)
        type: string
        required: false
      temporary_wsl_ifeo:
        description: 'APPROVAL REQUIRED: temporarily redirect ALL WSL launches on the disposable ARM runner only'
        type: boolean
        default: false
        required: false
      wsl_ifeo_approved_head:
        description: 'Exact approved workflow commit SHA; required with temporary_wsl_ifeo (attempt 1 only)'
        type: string
        default: ''
        required: false
      inspect_wsl_registry_only:
        description: 'READ-ONLY Windows ARM registry inspection; skips package tests and is NOT release validation'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: packaged-gui-${{ github.ref }}-${{ github.workflow }}${{ github.event_name == 'workflow_dispatch' && inputs.inspect_wsl_registry_only && '-registry-inspection' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.temporary_wsl_ifeo && format('-temporary-wsl-{0}', github.run_id) || '' }}
  cancel-in-progress: true
jobs:
  inspect-wsl-registry:
    name: Read-only Windows ARM registry inspection (NOT release validation)
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_wsl_registry_only
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Use the runner's preinstalled Python. No installation/fallback is allowed
      # in this read-only diagnostic route.
      - name: Inspect exact WSL registry targets without changes
        env:
          TEXSTUDIO_WSL_REGISTRY_INSPECTION: '1'
        run: python .github/scripts/inspect_windows_wsl_registry.py --output windows-registry-inspection/registry-report.json
      - name: Save read-only inspection (NOT release validation)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: read-only-windows-arm-registry-inspection
          path: windows-registry-inspection/
          if-no-files-found: warn

  select:
    if: github.event_name != 'workflow_dispatch' || !inputs.inspect_wsl_registry_only
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.build.outputs.run_id }}
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        name: Select compatible existing packages
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 .github/scripts/select-gui-build.py
  desktop:
    name: Packaged retest (${{ matrix.runner }})
    needs: select
    if: needs.select.outputs.run_id != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: texstudio-vim-win-qt6-zip
          - runner: windows-11-arm
            artifact: texstudio-vim-win-arm-qt6-zip
          - runner: macos-15-intel
            artifact: texstudio-osx
          - runner: macos-15
            artifact: texstudio-vim-osx-m1
    env:
      TEXSTUDIO_TEMPORARY_WSL_IFEO: ${{ github.event_name == 'workflow_dispatch' && inputs.temporary_wsl_ifeo && matrix.runner == 'windows-11-arm' && '1' || '0' }}
      TEXSTUDIO_IFEO_APPROVED_HEAD: ${{ inputs.wsl_ifeo_approved_head }}
      TEXSTUDIO_BUILD_RUN_ID: ${{ needs.select.outputs.run_id }}
      BUILD_SHA: ${{ needs.select.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      # The native inspector confirmed preinstalled 64-bit Python. Setup is early
      # to prevent new prompts; it cannot undo an already-running obstruction.
      - name: Apply explicitly approved temporary WSL redirect
        if: env.TEXSTUDIO_TEMPORARY_WSL_IFEO == '1'
        run: python .github/scripts/windows_wsl_ifeo.py setup
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: native-package
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare disposable Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/prepare-windows-gui.ps1
      - name: Desktop input dependencies
        run: python -m pip install pyautogui pillow
      - name: Packaged OS keyboard and mouse tests
        env:
          TEXSTUDIO_HOSTED_WSL_GUARD: ${{ matrix.runner == 'windows-11-arm' && '1' || '0' }}
          BUILD_SHA: ${{ needs.select.outputs.sha }}
        run: python .github/scripts/smoke-native-package.py
      - name: Remove exact temporary WSL redirect
        if: always() && env.TEXSTUDIO_TEMPORARY_WSL_IFEO == '1'
        run: python .github/scripts/windows_wsl_ifeo.py cleanup
      - name: Save GUI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-retest-${{ matrix.runner }}
          path: native-smoke-results/
          if-no-files-found: warn

  linux:
    name: AppImage retest (${{ matrix.name }})
    needs: select
    if: needs.select.outputs.run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-12
            image: debian:12
          - name: debian-13
            image: debian:13
          - name: fedora-43
            image: fedora:43
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: texstudio-linux
          path: appimage
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Packaged desktop smoke test
        env:
          SMOKE_NAME: ${{ matrix.name }}
          SMOKE_IMAGE: ${{ matrix.image }}
          BUILD_SHA: ${{ needs.select.outputs.sha }}
        run: >-
          docker run --rm --volume "$PWD:/work" --workdir /work
          --env SMOKE_NAME --env BUILD_SHA "$SMOKE_IMAGE"
          bash .github/scripts/smoke-appimage-container.sh
      - name: Save desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-retest-${{ matrix.name }}
          path: smoke-results/
          if-no-files-found: warn
