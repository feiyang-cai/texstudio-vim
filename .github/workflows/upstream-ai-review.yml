name: Upstream AI review
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request:
    if: (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.login == 'Copilot' || github.event.pull_request.user.login == 'copilot-swe-agent[bot]'))
    runs-on: ubuntu-24.04
    steps:
      # Never check out or execute the candidate branch with this user token.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Request separate Copilot code review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/request-upstream-ai-review.py
