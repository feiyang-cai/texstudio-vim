name: Vim desktop tests
on:
  push:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platforms to test
        type: choice
        default: all
        options: [all, macos, windows]

permissions:
  contents: read

concurrency:
  group: vim-desktop-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    name: Vim desktop (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: bash .github/scripts/install-macos-remote-test-deps.sh
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Configure
        run: >-
          cmake -S . -B build-vim -G Ninja
          -DCMAKE_PREFIX_PATH="${REMOTE_TEST_QT};$(brew --prefix hunspell)"
          -DCMAKE_DISABLE_FIND_PACKAGE_QuaZip-Qt6=ON -DCMAKE_DISABLE_FIND_PACKAGE_QuaZip=ON
          -DCMAKE_BUILD_TYPE=Debug -DTEXSTUDIO_ENABLE_TESTS=ON
          -DTEXSTUDIO_BUILD_ADWAITA=OFF -DTEXSTUDIO_ENABLE_CRASH_HANDLER=OFF
      - name: Build
        run: cmake --build build-vim --parallel 2
      - name: Native desktop Vim tests
        run: python3 .github/scripts/run-vim-tests.py build-vim/texstudio.app/Contents/MacOS/texstudio
      - name: Remote workspace transport and safety tests
        run: |
          python3 tests/remote/test_agent.py
          cmake -S tests/remote -B build-remote-tests -DCMAKE_PREFIX_PATH="${REMOTE_TEST_QT}"
          cmake --build build-remote-tests --parallel 2
          python3 tests/remote/run_ssh_tests.py build-remote-tests/remote-workspace-tests
      - name: Native remote editor, compiler, PDF and SyncTeX
        run: python3 tests/remote/run_gui_tests.py build-vim/texstudio.app/Contents/MacOS/texstudio
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vim-tests-${{ matrix.runner }}
          path: |
            vim-test-results/
            remote-test-results/
          if-no-files-found: warn

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    name: Vim desktop (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            msystem: UCRT64
            package: mingw-w64-ucrt-x86_64
          - runner: windows-11-arm
            msystem: CLANGARM64
            package: mingw-w64-clang-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-tinytex@v2
      - name: OpenSSH server for disposable loopback tests
        shell: pwsh
        timeout-minutes: 5
        run: .github/scripts/prepare-remote-test-sshd.ps1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git ${{ matrix.package }}-cmake ${{ matrix.package }}-toolchain
            ${{ matrix.package }}-ninja ${{ matrix.package }}-qt6-base
            ${{ matrix.package }}-qt6-declarative ${{ matrix.package }}-qt6-tools
            ${{ matrix.package }}-qt6-svg ${{ matrix.package }}-quazip-qt6
            ${{ matrix.package }}-hunspell ${{ matrix.package }}-python
            ${{ matrix.package }}-poppler-qt6
      - name: Configure
        run: >-
          cmake -S . -B build-vim -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DTEXSTUDIO_ENABLE_TESTS=ON -DTEXSTUDIO_BUILD_ADWAITA=OFF
          -DTEXSTUDIO_ENABLE_CRASH_HANDLER=OFF
      - name: Build
        run: cmake --build build-vim --parallel 2
      - name: Native desktop Vim tests
        run: python .github/scripts/run-vim-tests.py build-vim/texstudio.exe
      - name: Remote workspace transport and safety tests
        run: |
          export PATH="/c/Windows/System32/OpenSSH:$PATH"
          python tests/remote/test_agent.py
          cmake -S tests/remote -B build-remote-tests -G Ninja
          cmake --build build-remote-tests --parallel 2
          python tests/remote/run_ssh_tests.py build-remote-tests/remote-workspace-tests.exe
      - name: Native remote editor, compiler, PDF and SyncTeX
        run: |
          export PATH="/c/Windows/System32/OpenSSH:$PATH"
          python tests/remote/run_gui_tests.py build-vim/texstudio.exe
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vim-tests-${{ matrix.runner }}
          path: |
            vim-test-results/
            remote-test-results/
          if-no-files-found: warn
